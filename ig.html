<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipForge · Instagram connected</title>
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#0b1020;color:#eef2f8;display:grid;place-items:center;min-height:100vh;padding:16px}
.c{max-width:560px;width:100%;background:#151c2f;border:1px solid #2c3752;border-radius:16px;padding:24px}
code{display:block;word-break:break-all;background:#0b1020;border:1px solid #2c3752;border-radius:10px;padding:12px;margin:12px 0;font-size:13px}
button{background:linear-gradient(135deg,#8b7cff,#22d3ee);border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer}</style></head>
<body><div class="c"><h2 style="margin-top:0">Instagram login done</h2>
<p id="msg">Copy this code and paste it into ClipForge (Channels → Instagram → Finish).</p>
<code id="code">—</code><button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent);this.textContent='Copied'">Copy code</button>
</div><script>
const q=new URLSearchParams(location.search); const code=(q.get('code')||'').replace(/#_$/,'');
if(code){document.getElementById('code').textContent=code}else{document.getElementById('msg').textContent='No code found: '+(q.get('error_description')||q.get('error')||'try connecting again.')}
</script></body></html>
